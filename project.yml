# XcodeGen project spec. CI runs `xcodegen generate` to create Tabbit.xcodeproj.
# The .xcodeproj and the Info.plist are generated: edit this file, not them.

name: Tabbit

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # ---------------------------------------------------------------
    # App identity: change these two lines to rename the app or use
    # a different bundle ID. Targets and Info.plist read them via $(...).
    # The bundle ID must be unique across ALL Apple developers, or
    # Sideloadly fails with "(9401) ... is not available".
    # ---------------------------------------------------------------
    APP_BUNDLE_ID: com.eightbitbyte.tabbit
    APP_DISPLAY_NAME: Tabbit

targets:
  Tabbit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tabbit
        excludes:
          - "Resources/PrivacyInfo.xcprivacy"
      # Apple's privacy manifest (App Store requirement), copied into the app bundle.
      - path: Tabbit/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "11"
        # Tabbit/Assets.xcassets/AppIcon.appiconset (made by Design/AppIcon/make_app_icon.py)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

        # Swift 5 language mode keeps concurrency checking lenient on newer Xcode.
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # iPhone only.
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # Debug builds (simulator tests and CI screenshots) include DemoMode.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    info:
      path: Tabbit/Info.plist
      properties:
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: "$(APP_DISPLAY_NAME) uses the camera to scan your receipts."
        NSPhotoLibraryAddUsageDescription: "$(APP_DISPLAY_NAME) saves receipt photos to your library when you ask it to."
        # No custom encryption (App Store export compliance).
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  # Unit tests for the parsing code. CI runs them on an iPhone simulator.
  # JSON files in TabbitTests/Fixtures are bundled as test resources.
  TabbitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TabbitTests
    dependencies:
      - target: Tabbit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID).tests"
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Tabbit:
    build:
      targets:
        Tabbit: all
        TabbitTests: [test]
    test:
      config: Debug
      targets:
        - TabbitTests
