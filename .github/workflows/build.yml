name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run (saves macOS minutes).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, iphoneos, unsigned)
        run: |
          xcodebuild \
            -project Tabbit.xcodeproj \
            -scheme Tabbit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Tabbit.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "error: built app not found at $APP_PATH"
            exit 1
          fi
          echo "Bundled Info.plist:"
          plutil -p "$APP_PATH/Info.plist"
          echo "Bundle contents:"
          ls "$APP_PATH"
          if [ ! -f "$APP_PATH/PrivacyInfo.xcprivacy" ]; then
            echo "error: PrivacyInfo.xcprivacy is missing from the app bundle"
            exit 1
          fi
          rm -rf Payload ReceiptScanner.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ReceiptScanner.ipa Payload
          ls -lh ReceiptScanner.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ReceiptScanner
          path: ReceiptScanner.ipa
          if-no-files-found: error

  # Runs in parallel with the build, so the IPA is still produced if a test fails.
  test:
    name: Unit tests + screenshots (iPhone simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    # Write access only to push the design screenshots to the ci-screenshots branch.
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          # Newest installed iOS runtime, first iPhone in it. Avoids hard-coding
          # a device name that may not exist on the runner image.
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(part) for part in runtime.split("iOS-")[-1].split("-") if part.isdigit()]
          runtimes = sorted((r for r in devices if ".iOS-" in r), key=version, reverse=True)
          for runtime in runtimes:
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(runtime + " / " + device["name"], file=sys.stderr)
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("No available iPhone simulator found")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Tabbit.xcodeproj \
            -scheme Tabbit \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      # Design previews without a Mac: launch the Debug build in demo mode on the
      # simulator and capture each screen in light and dark mode.
      - name: Capture design screenshots
        if: ${{ !cancelled() }}
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/Tabbit.app"
          if [ ! -d "$APP" ]; then
            echo "No simulator build found; skipping screenshots."
            exit 0
          fi
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          for appearance in light dark; do
            xcrun simctl ui "$UDID" appearance "$appearance"
            for screen in groups group swipe receipt settle edit category add mine sort map mappin mapfix mapoff groupmap profile profileedit settings whatsnew processing dialog empty; do
              xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
              xcrun simctl launch "$UDID" "$BUNDLE_ID" -TabbitDemo -TabbitScreen "$screen"
              sleep 5
              # Map tiles come from Apple Maps and take a little longer to load.
              case "$screen" in
                map|mappin|groupmap) sleep 5 ;;
              esac
              xcrun simctl io "$UDID" screenshot "screenshots/$screen-$appearance.png"
            done
          done
          ls -l screenshots

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: design-screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Publish screenshots to the ci-screenshots branch
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d screenshots ] || [ -z "$(ls -A screenshots)" ]; then
            echo "No screenshots to publish."
            exit 0
          fi
          cd screenshots
          printf "Screenshots for %s (%s)\n" "$GITHUB_SHA" "$GITHUB_REF_NAME" > README.md
          git init -q
          git checkout -q -b ci-screenshots
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screenshots for ${GITHUB_SHA::7} [skip ci]"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
          echo "Published to the ci-screenshots branch."
