name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run (saves macOS minutes).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, iphoneos, unsigned)
        run: |
          xcodebuild \
            -project Tabbit.xcodeproj \
            -scheme Tabbit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Tabbit.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "error: built app not found at $APP_PATH"
            exit 1
          fi
          echo "Bundled Info.plist:"
          plutil -p "$APP_PATH/Info.plist"
          rm -rf Payload ReceiptScanner.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ReceiptScanner.ipa Payload
          ls -lh ReceiptScanner.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ReceiptScanner
          path: ReceiptScanner.ipa
          if-no-files-found: error
